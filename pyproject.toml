[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fan-video-vibration"
version = "0.1.0"
description = "Research pipeline for ROI-based video vibration measurement"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "opencv-python-headless>=4.8,<5", "matplotlib>=3.7,<4"]

[project.scripts]
fanvib = "fanvib.cli:main"

[tool.setuptools.packages.find]
include = ["fanvib*"]
